<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050806">
<title>Rasson Snooker Academy</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;display:grid;place-items:center;overflow:hidden;color:#fff;background:linear-gradient(135deg,rgba(2,8,6,.82),rgba(2,18,11,.58)),url('assets/rasson-background') center/cover no-repeat fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(255,215,120,.10),transparent 38%),linear-gradient(rgba(0,0,0,.05),rgba(0,0,0,.42))}
.landing{position:relative;z-index:1;width:100%;min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.brand-box{transform:translateY(-3vh);padding:clamp(28px,4vw,58px);border:1px solid rgba(240,210,127,.55);border-radius:26px;background:rgba(0,8,5,.38);box-shadow:0 0 35px rgba(0,255,157,.08),inset 0 0 35px rgba(240,210,127,.04);backdrop-filter:blur(8px)}
.brand-top{font-size:clamp(48px,9vw,116px);font-weight:900;letter-spacing:.18em;line-height:.95;text-transform:uppercase;color:#f0d27f;text-shadow:0 0 12px rgba(240,210,127,.35),0 0 42px rgba(240,210,127,.16)}
.brand-academy{margin-top:18px;font-size:clamp(18px,2.5vw,34px);font-weight:800;letter-spacing:.48em;text-transform:uppercase;color:#fff;text-shadow:0 0 18px rgba(255,255,255,.18)}
.divider{width:min(520px,70vw);height:1px;margin:28px auto 22px;background:linear-gradient(90deg,transparent,#f0d27f,transparent);box-shadow:0 0 12px rgba(240,210,127,.35)}
.slogan{font-size:clamp(10px,1.2vw,15px);font-weight:800;letter-spacing:.42em;text-transform:uppercase;color:#00ff9d;text-shadow:0 0 15px rgba(0,255,157,.35)}
.mode-buttons{display:flex;justify-content:center;gap:16px;margin-top:34px}
.mode-btn{min-width:190px;padding:17px 24px;border:1px solid #00ff9d;border-radius:13px;background:linear-gradient(135deg,rgba(0,255,157,.14),rgba(0,0,0,.35));color:#fff;font-size:13px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 18px rgba(0,255,157,.12);transition:.2s}
.mode-btn:hover{transform:translateY(-3px);background:linear-gradient(135deg,rgba(0,255,157,.3),rgba(0,0,0,.4));box-shadow:0 0 25px rgba(0,255,157,.3)}
.mode-btn.century{border-color:#f0d27f;color:#f0d27f;box-shadow:0 0 18px rgba(240,210,127,.12)}
.mode-btn.century:hover{background:linear-gradient(135deg,rgba(240,210,127,.2),rgba(0,0,0,.4));box-shadow:0 0 25px rgba(240,210,127,.25)}
@media(max-width:600px){.brand-box{width:100%;padding:30px 18px}.brand-top{letter-spacing:.10em}.brand-academy{letter-spacing:.25em}.divider{margin:22px auto 18px}.slogan{letter-spacing:.24em}.mode-buttons{flex-direction:column;align-items:center;gap:12px}.mode-btn{width:min(320px,100%)}}
</style>
</head>
<body>
<main class="landing">
<section class="brand-box" aria-label="Rasson Snooker Academy">
<div class="brand-top">RASSON</div>
<div class="brand-academy">SNOOKER ACADEMY</div>
<div class="divider"></div>
<div class="slogan">POWERED BY XL SNOOKER</div>
<div class="mode-buttons" aria-label="Game modes">
<button class="mode-btn" type="button">Frame Mode</button>
<button class="mode-btn century" type="button">Century Mode</button>
</div>
</section>
</main>
</body>
</html>
